
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programación Radio Sapukay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Fredoka',sans-serif}
body{background:transparent;color:#fff;padding:8px;width:100%;overflow-x:hidden}
.card{background:rgba(30,35,45,.90);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);width:100%}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:10px;margin-bottom:12px}
.title-group{display:flex;align-items:center;gap:8px}
.station-name{font-size:15px;font-weight:700;color:#ff9800;letter-spacing:.5px}
.day-title{font-size:12px;color:#c5cbd6;font-weight:600;text-transform:uppercase;text-align:right}
.day-buttons{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:14px}
.day-btn{border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px 2px;background:rgba(255,255,255,.06);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.day-btn.selected{background:#ff9800;color:#1d1d1d;border-color:#ff9800}
.program-list{display:flex;flex-direction:column;gap:8px}
.program-item{display:flex;align-items:center;gap:8px;justify-content:space-between;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;border:1px solid transparent}
.program-item.active{background:rgba(255,152,0,.19);border-color:rgba(255,152,0,.65);box-shadow:0 0 12px rgba(255,152,0,.15)}
.program-time{font-size:12px;font-weight:600;color:#d2d6dc;min-width:105px;white-space:nowrap}
.program-item.active .program-time{color:#ffb74d}
.program-name{font-size:14px;font-weight:600;flex:1;color:#fff}
.badge-live{display:none;background:#e53935;color:#fff;font-size:10px;font-weight:700;padding:4px 7px;border-radius:20px;letter-spacing:.3px;white-space:nowrap}
.program-item.active .badge-live{display:inline-block;animation:pulse 1.5s infinite}
.status-note{font-size:12px;color:#c5cbd6;margin-top:10px;line-height:1.4}
.footer-info{margin-top:14px;text-align:center;font-size:11px;color:#aeb7c4;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media(max-width:420px){.card{padding:12px}.day-btn{font-size:10px;padding:8px 0}.program-time{min-width:94px;font-size:11px}.program-name{font-size:13px}.badge-live{font-size:9px;padding:4px 5px}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title-group"><span>📻</span><span class="station-name">SAPUKAY 90.9</span></div>
    <div class="day-title" id="day-name">PROGRAMACIÓN</div>
  </div>

  <div class="day-buttons" aria-label="Elegir día">
    <button class="day-btn" data-day="1">LUN</button>
    <button class="day-btn" data-day="2">MAR</button>
    <button class="day-btn" data-day="3">MIÉ</button>
    <button class="day-btn" data-day="4">JUE</button>
    <button class="day-btn" data-day="5">VIE</button>
    <button class="day-btn" data-day="6">SÁB</button>
    <button class="day-btn" data-day="0">DOM</button>
  </div>

  <div class="program-list" id="program-list"></div>
  <div class="status-note" id="status-note"></div>
  <div class="footer-info">Gente como vos, haciendo radio.</div>
</div>

<script>
const schedule = {
  1:{dayName:"Lunes",programs:[
    {time:"06:30–09:00",start:"06:30",end:"09:00",name:"Cara y Ceca"},
    {time:"09:00–12:00",start:"09:00",end:"12:00",name:"El Informador Comunitario"},
    {time:"12:30–12:45",start:"12:30",end:"12:45",name:"Informativo FARCO"},
    {time:"14:30–15:30",start:"14:30",end:"15:30",name:"Soplo de Vida"}
  ]},
  2:{dayName:"Martes",programs:[
    {time:"06:30–09:00",start:"06:30",end:"09:00",name:"Cara y Ceca"},
    {time:"09:00–12:00",start:"09:00",end:"12:00",name:"El Informador Comunitario"},
    {time:"12:30–12:45",start:"12:30",end:"12:45",name:"Informativo FARCO"},
    {time:"16:00–17:30",start:"16:00",end:"17:30",name:"Manos de Mujeres"}
  ]},
  3:{dayName:"Miércoles",programs:[
    {time:"06:30–09:00",start:"06:30",end:"09:00",name:"Cara y Ceca"},
    {time:"09:00–12:00",start:"09:00",end:"12:00",name:"El Informador Comunitario"},
    {time:"12:30–12:45",start:"12:30",end:"12:45",name:"Informativo FARCO"},
    {time:"17:15–19:00",start:"17:15",end:"19:00",name:"Aquí voy para Entre Ríos"},
    {time:"19:00–20:00",start:"19:00",end:"20:00",name:"El Pero del Falo"},
    {time:"20:00–23:00",start:"20:00",end:"23:00",name:"Los Negros de Miércoles"}
  ]},
  4:{dayName:"Jueves",programs:[
    {time:"06:30–09:00",start:"06:30",end:"09:00",name:"Cara y Ceca"},
    {time:"09:00–12:00",start:"09:00",end:"12:00",name:"El Informador Comunitario"},
    {time:"12:30–12:45",start:"12:30",end:"12:45",name:"Informativo FARCO"}
  ]},
  5:{dayName:"Viernes",programs:[
    {time:"06:30–09:00",start:"06:30",end:"09:00",name:"Cara y Ceca"},
    {time:"09:00–12:00",start:"09:00",end:"12:00",name:"El Informador Comunitario"},
    {time:"12:30–12:45",start:"12:30",end:"12:45",name:"Informativo FARCO"},
    {time:"14:00–17:00",start:"14:00",end:"17:00",name:"Reporte Semanal"},
    {time:"18:30–20:00",start:"18:30",end:"20:00",name:"Crece desde el pie"},
    {time:"20:00–22:00",start:"20:00",end:"22:00",name:"Un Mismo Río"},
    {time:"22:00–00:00",start:"22:00",end:"24:00",name:"Reggae One Blood"}
  ]},
  6:{dayName:"Sábado",programs:[
    {time:"08:00–10:00",start:"08:00",end:"10:00",name:"Entre mate y mate"},
    {time:"12:30–14:00",start:"12:30",end:"14:00",name:"El Desconcierto de Quique Pesoa"}
  ]},
  0:{dayName:"Domingo",programs:[
    {time:"19:00–20:00",start:"19:00",end:"20:00",name:"La Santa Voz Murguera"}
  ]}
};

function argentinaNowParts(){
  const parts=new Intl.DateTimeFormat("en-US",{
    timeZone:"America/Argentina/Buenos_Aires",
    weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"
  }).formatToParts(new Date());
  const p={};parts.forEach(x=>p[x.type]=x.value);
  const days={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return {day:days[p.weekday],minutes:Number(p.hour)*60+Number(p.minute)};
}
function toMinutes(value){
  const [h,m]=value.split(":").map(Number);
  return h*60+m;
}
function renderSchedule(day){
  const data=schedule[day],now=argentinaNowParts();
  document.getElementById("day-name").textContent="PROGRAMACIÓN ("+data.dayName+")";
  document.querySelectorAll(".day-btn").forEach(btn=>{
    const selected=Number(btn.dataset.day)===day;
    btn.classList.toggle("selected",selected);
    btn.setAttribute("aria-pressed",selected?"true":"false");
  });
  const container=document.getElementById("program-list");
  container.innerHTML="";
  let liveFound=false;
  data.programs.forEach(prog=>{
    const live=day===now.day&&now.minutes>=toMinutes(prog.start)&&now.minutes<toMinutes(prog.end);
    if(live)liveFound=true;
    const item=document.createElement("div");
    item.className="program-item"+(live?" active":"");
    const time=document.createElement("span");
    time.className="program-time";time.textContent=prog.time;
    const name=document.createElement("span");
    name.className="program-name";name.textContent=prog.name;
    const badge=document.createElement("span");
    badge.className="badge-live";badge.textContent="EN VIVO";
    item.append(time,name,badge);
    container.appendChild(item);
  });
  document.getElementById("status-note").textContent=liveFound
    ?"Ahora estamos al aire con este programa."
    :"Consultá los horarios y acompañanos en vivo.";
}
document.querySelectorAll(".day-btn").forEach(btn=>{
  btn.addEventListener("click",()=>renderSchedule(Number(btn.dataset.day)));
});
renderSchedule(argentinaNowParts().day);
setInterval(()=>{
  const selected=document.querySelector(".day-btn.selected");
  if(selected)renderSchedule(Number(selected.dataset.day));
},60000);
</script>
</body>
</html>
