<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Sapukay - Efemérides del Día</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            background-color: transparent;
            color: #ffffff;
            padding: 12px;
            width: 420px;
            overflow: hidden;
        }

        .card {
            background: rgba(30, 35, 45, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .station-name {
            font-size: 15px;
            font-weight: 700;
            color: #ff9800;
            letter-spacing: 0.5px;
        }

        .section-title {
            font-size: 12px;
            color: #a0aabe;
            font-weight: 600;
            text-transform: uppercase;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Personalización de la barra de desplazamiento */
        .feed-container::-webkit-scrollbar {
            width: 5px;
        }
        .feed-container::-webkit-scrollbar-thumb {
            background: rgba(255, 152, 0, 0.4);
            border-radius: 10px;
        }

        .feed-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .feed-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 152, 0, 0.4);
        }

        .item-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .item-description {
            font-size: 12px;
            color: #cccccc;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .loading, .error {
            text-align: center;
            font-size: 13px;
            color: #a0aabe;
            padding: 20px 0;
        }

        .footer-info {
            margin-top: 12px;
            text-align: center;
            font-size: 11px;
            color: #8899a6;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="title-group">
                <span>📅</span>
                <span class="station-name">SAPUKAY 90.9</span>
            </div>
            <div class="section-title">EFEMÉRIDES</div>
        </div>

        <div class="feed-container" id="feed-container">
            <div class="loading">Cargando efemérides...</div>
        </div>

        <div class="footer-info">
            Un día como hoy en la historia
        </div>
    </div>

    <script>
        const rssUrl = "https://rss.app/feeds/NwmBYVOhqFGuYUDG.xml";
        const apiConverterUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

        async function fetchEfemerides() {
            const container = document.getElementById('feed-container');

            try {
                const response = await fetch(apiConverterUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    container.innerHTML = '';

                    data.items.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'feed-item';

                        // Limpiar etiquetas HTML de la descripción si las hubiera
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = item.description || '';
                        const cleanDescription = tempDiv.textContent || tempDiv.innerText || '';

                        itemDiv.innerHTML = `
                            <div class="item-title">${item.title}</div>
                            ${cleanDescription ? `<div class="item-description">${cleanDescription}</div>` : ''}
                        `;

                        container.appendChild(itemDiv);
                    });
                } else {
                    container.innerHTML = '<div class="error">No se encontraron efemérides para hoy.</div>';
                }
            } catch (err) {
                console.error("Error al obtener el feed RSS:", err);
                container.innerHTML = '<div class="error">Error al cargar las efemérides.</div>';
            }
        }

        fetchEfemerides();
        // Actualiza el contenido del RSS cada 30 minutos
        setInterval(fetchEfemerides, 1800000);
    </script>
</body>
</html>
