<script>
    // URL limpia del feed RSS directo
    const rssFeedUrl = "https://rss.app/feeds/_fQ6HxMQcs05FydMJ.xml";
    
    // API principal
    const apiConverterUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssFeedUrl)}`;

    async function fetchRssFeed() {
        const container = document.getElementById('feed-container');

        try {
            // Intento 1: A través de rss2json
            let response = await fetch(apiConverterUrl);
            let data = await response.json();

            if (data.status === 'ok' && data.items && data.items.length > 0) {
                renderItems(data.items);
            } else {
                // Intento 2: Proxy alternativo en caso de que rss2json no devuelva datos
                fetchFallbackRSS();
            }
        } catch (err) {
            console.warn("Fallo rss2json, intentando vía fallback...", err);
            fetchFallbackRSS();
        }
    }

    async function fetchFallbackRSS() {
        const container = document.getElementById('feed-container');
        const fallbackUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssFeedUrl)}`;

        try {
            const res = await fetch(fallbackUrl);
            const data = await res.json();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(data.contents, "text/xml");
            const items = xmlDoc.querySelectorAll("item");

            if (items.length > 0) {
                container.innerHTML = '';
                items.forEach(item => {
                    const title = item.querySelector("title")?.textContent || "Sin título";
                    const descriptionRaw = item.querySelector("description")?.textContent || "";
                    
                    // Extraer imagen de la descripción HTML
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = descriptionRaw;
                    const imgTag = tempDiv.querySelector('img');
                    const imageUrl = imgTag ? imgTag.src : '';
                    if (imgTag) imgTag.remove();

                    const cleanDescription = tempDiv.textContent || tempDiv.innerText || '';

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'feed-item';

                    let htmlContent = '';
                    if (imageUrl) {
                        htmlContent += `<img src="${imageUrl}" class="feed-img" alt="Imagen noticia">`;
                    }

                    htmlContent += `
                        <div class="feed-content">
                            <div class="item-title">${title}</div>
                            ${cleanDescription.trim() ? `<div class="item-description">${cleanDescription}</div>` : ''}
                        </div>
                    `;

                    itemDiv.innerHTML = htmlContent;
                    container.appendChild(itemDiv);
                });
            } else {
                container.innerHTML = '<div class="error">No se encontraron publicaciones en el feed.</div>';
            }
        } catch (err) {
            console.error("Error definitivo al cargar el RSS:", err);
            container.innerHTML = '<div class="error">No se pudieron cargar las noticias. Verifica la URL del feed.</div>';
        }
    }

    function renderItems(items) {
        const container = document.getElementById('feed-container');
        container.innerHTML = '';

        items.forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'feed-item';

            let imageUrl = '';
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = item.description || '';
            
            const imgTag = tempDiv.querySelector('img');
            if (imgTag) {
                imageUrl = imgTag.src;
                imgTag.remove();
            } else if (item.thumbnail) {
                imageUrl = item.thumbnail;
            } else if (item.enclosure && item.enclosure.link) {
                imageUrl = item.enclosure.link;
            }

            const cleanDescription = tempDiv.textContent || tempDiv.innerText || '';

            let htmlContent = '';
            if (imageUrl) {
                htmlContent += `<img src="${imageUrl}" class="feed-img" alt="Imagen noticia">`;
            }

            htmlContent += `
                <div class="feed-content">
                    <div class="item-title">${item.title}</div>
                    ${cleanDescription.trim() ? `<div class="item-description">${cleanDescription}</div>` : ''}
                </div>
            `;

            itemDiv.innerHTML = htmlContent;
            container.appendChild(itemDiv);
        });
    }

    fetchRssFeed();
    setInterval(fetchRssFeed, 1800000);
</script>
